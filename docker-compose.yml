services:
  auth:
    build:
      context: ./services/auth_go
    ports:
      - "8001:8001"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-emulator:9099
      - FIREBASE_AUTH_URL=http://firebase-emulator:9099/identitytoolkit.googleapis.com/v1/accounts
      - FIREBASE_WEB_API_KEY=any-mock-key
      - ALLOW_LONG_LIVED_TOKENS=true
    env_file: ./services/auth_go/.env
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  profiles:
    build:
      context: ./services/profiles_go
    ports:
      - "8002:8002"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PORT=8002
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_TOPIC_ID=dev-profiles-profile-events-v1
      - PUBSUB_PROJECT_ID=tavern-swiper-dev
    env_file: ./services/profiles_go/.env
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/profiles/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  discovery:
    build:
      context: ./services/discovery_go
    ports:
      - "8003:8003"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PORT=8003
      - ALLOW_LONG_LIVED_TOKENS=true
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=tavern-swiper-dev
      - PUBSUB_TOPIC_ID=dev-discovery-match-events-v1
    env_file: ./services/discovery_go/.env
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      profiles:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/discovery/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  messages:
    build:
      context: ./services/messages_go
    ports:
      - "8005:8005"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PORT=8005
    env_file: ./services/messages_go/.env
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      profiles:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/messages/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  users:
    build:
      context: ./services/users_go
    ports:
      - "8006:8006"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PORT=8006
    env_file: ./services/users_go/.env
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/users/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    ports:
      - "8085:8085"
    command: ["gcloud", "beta", "emulators", "pubsub", "start", "--host-port=0.0.0.0:8085"]
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:8085"]
      interval: 5s
      timeout: 5s
      retries: 5

  discovery-subscriber:
    command: go run cmd/local/main.go
    build:
      context: ./services/discovery_subscriber
    environment:
      - FIRESTORE_DATABASE_ID=discovery-dev
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PORT=8007
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "8007:8007"

  messages-subscriber:
    build:
      context: ./services/messages_subscriber
    environment:
      - FIRESTORE_DATABASE_ID=messages-dev
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PORT=8008
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "8008:8008"


  firebase-emulator:
    build:
      context: ./services/firebase-emulator
    ports:
      - "9099:9099"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      # We just need to check if the port is open since we don't have curl in slim
      test: ["CMD-SHELL", "nc -z localhost 9099"]
      interval: 5s
      timeout: 5s
      retries: 10

  init-pubsub:
    image: curlimages/curl:latest
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    command: >
      sh -c "curl -s -X PUT 'http://pubsub-emulator:8085/v1/projects/tavern-swiper-dev/topics/dev-profiles-profile-events-v1' && \
             curl -s -X PUT 'http://pubsub-emulator:8085/v1/projects/tavern-swiper-dev/subscriptions/dev-discovery-subscriber-sub' -H 'Content-Type: application/json' -d '{\"topic\":\"projects/tavern-swiper-dev/topics/dev-profiles-profile-events-v1\",\"pushConfig\":{\"pushEndpoint\":\"http://discovery-subscriber:8007/HandleProfileEvent\"}}' && \
             curl -s -X PUT 'http://pubsub-emulator:8085/v1/projects/tavern-swiper-dev/topics/dev-discovery-match-events-v1' && \
             curl -s -X PUT 'http://pubsub-emulator:8085/v1/projects/tavern-swiper-dev/subscriptions/dev-messages-subscriber-sub' -H 'Content-Type: application/json' -d '{\"topic\":\"projects/tavern-swiper-dev/topics/dev-discovery-match-events-v1\",\"pushConfig\":{\"pushEndpoint\":\"http://messages-subscriber:8008/\"}}' && \
             echo '✅ Pub/Sub Initialized'"
    networks:
      - default


networks:
  default:
    driver: bridge
