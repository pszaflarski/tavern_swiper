services:
  auth:
    build:
      context: ./services/auth_go
    ports:
      - "8001:8001"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
    env_file: ./services/auth_go/.env
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  profiles:
    build:
      context: ./services/profiles_go
    ports:
      - "8002:8002"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PUBSUB_EMULATOR_HOST=pubsub:8085
      - PORT=8002
    env_file: ./services/profiles_go/.env
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    depends_on:
      pubsub:
        condition: service_started
    healthcheck:

      test: ["CMD", "curl", "-f", "http://localhost:8002/profiles/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  discovery:
    build:
      context: ./services/discovery_go
    ports:
      - "8003:8003"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PORT=8003
    env_file: ./services/discovery_go/.env
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    depends_on:
      profiles:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/discovery/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  messages:
    build:
      context: ./services/messages
    ports:
      - "8005:8005"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
    env_file: ./services/messages/.env
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    depends_on:
      profiles:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/messages/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  users:
    build: ./services/users
    ports:
      - "8006:8006"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
    env_file: ./services/users/.env
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/users/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  pubsub:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    command: gcloud beta emulators pubsub start --hostport=0.0.0.0:8085 --project=tavern-swiper-dev
    ports:
      - "8085:8085"
    networks:
      - tavern-net

  pubsub-init:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    depends_on:
      - pubsub
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub:8085
    command: >
      bash -c "
        sleep 5;
        gcloud pubsub topics create dev-profiles-profile-events-v1 --project=tavern-swiper-dev;
        gcloud pubsub subscriptions create dev-discovery-from-profiles-profile-events-v1-sub --topic=dev-profiles-profile-events-v1 --project=tavern-swiper-dev;
        echo 'Pub/Sub initialized'
      "
    networks:
      - tavern-net

  discovery-subscriber:
    build:
      context: ./services/discovery_subscriber
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PUBSUB_EMULATOR_HOST=pubsub:8085
      - FIRESTORE_DATABASE_ID=profiles
      - PUBSUB_TOPIC_ID=dev-profiles-profile-events-v1
      - PUBSUB_SUB_ID=dev-discovery-from-profiles-profile-events-v1-sub
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    depends_on:
      pubsub:
        condition: service_started

networks:

  tavern-net:
    driver: bridge
