services:
  auth:
    build:
      context: ./services/auth_go
    ports:
      - "8001:8001"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
    env_file: ./services/auth_go/.env
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 100M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  profiles:
    build:
      context: ./services/profiles_go
    ports:
      - "8002:8002"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PORT=8002
    env_file: ./services/profiles_go/.env
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 100M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/profiles/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  discovery:
    build:
      context: ./services/discovery_go
    ports:
      - "8003:8003"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PORT=8003
    env_file: ./services/discovery_go/.env
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 100M
    depends_on:
      profiles:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/discovery/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  messages:
    build:
      context: ./services/messages_go
    ports:
      - "8005:8005"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PORT=8005
    env_file: ./services/messages_go/.env
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 100M
    depends_on:
      profiles:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/messages/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  users:
    build:
      context: ./services/users_go
    ports:
      - "8006:8006"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PORT=8006
    env_file: ./services/users_go/.env
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 100M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/users/health"]
      interval: 10s
      timeout: 5s
      retries: 3


networks:
  tavern-net:
    driver: bridge
