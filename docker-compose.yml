services:
  auth:
    build:
      context: ./services/auth_go
    ports:
      - "8001:8001"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
    env_file: ./services/auth_go/.env
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 100M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  profiles:
    build:
      context: ./services/profiles_go
    ports:
      - "8002:8002"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PUBSUB_EMULATOR_HOST=pubsub:8085
      - PORT=8002
    env_file: ./services/profiles_go/.env
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 100M
    depends_on:
      pubsub:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/profiles/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  discovery:
    build:
      context: ./services/discovery_go
    ports:
      - "8003:8003"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PORT=8003
    env_file: ./services/discovery_go/.env
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 100M
    depends_on:
      profiles:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/discovery/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  messages:
    build:
      context: ./services/messages_go
    ports:
      - "8005:8005"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PORT=8005
    env_file: ./services/messages_go/.env
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 100M
    depends_on:
      profiles:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/messages/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  users:
    build:
      context: ./services/users_go
    ports:
      - "8006:8006"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PORT=8006
    env_file: ./services/users_go/.env
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 100M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/users/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  pubsub:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    command: gcloud beta emulators pubsub start --hostport=0.0.0.0:8085 --project=tavern-swiper-dev
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  pubsub-init:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    depends_on:
      - pubsub
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub:8085
    command: >
      bash -c "
        sleep 5;
        gcloud pubsub topics create dev-profiles-profile-events-v1 --project=tavern-swiper-dev;
        gcloud pubsub subscriptions create dev-discovery-from-profiles-profile-events-v1-sub --topic=dev-profiles-profile-events-v1 --project=tavern-swiper-dev;
        echo 'Pub/Sub initialized'
      "
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  discovery-subscriber:
    build:
      context: ./services/discovery_subscriber
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PUBSUB_EMULATOR_HOST=pubsub:8085
      - FIRESTORE_DATABASE_ID=discovery-dev
      - PUBSUB_TOPIC_ID=dev-profiles-profile-events-v1
      - PUBSUB_SUB_ID=dev-discovery-from-profiles-profile-events-v1-sub
    volumes:
      - /home/peter/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 100M
    depends_on:
      pubsub:
        condition: service_started

networks:

  tavern-net:
    driver: bridge
