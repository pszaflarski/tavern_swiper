services:
  auth:
    build:
      context: ./services/auth/auth_go
    ports:
      - "8001:8001"
    environment:
      - FIRESTORE_DATABASE_ID=auth-test
      - USERS_DATABASE_ID=users-test
      - FIREBASE_WEB_API_KEY=AIzaSyCLDTIuGwoRcGLF1woXC6I1644-jSSXjNk
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
    volumes:
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  profiles:
    build:
      context: ./services/profiles/profiles_go
    ports:
      - "8002:8002"
    environment:
      - FIRESTORE_DATABASE_ID=profiles-test
      - GCS_BUCKET_NAME=tavern-swiper-dev-media-test
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_TOPIC_ID=dev-profiles-profile-events-v1
    volumes:
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/profiles/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  discovery:
    build:
      context: ./services/discovery/discovery_go
    ports:
      - "8003:8003"
    volumes:
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      - FIRESTORE_DATABASE_ID=discovery-test
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=tavern-swiper-dev
      - PUBSUB_TOPIC_ID=dev-discovery-match-events-v1
    depends_on:
      profiles:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/discovery/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  messages:
    build:
      context: ./services/messages/messages_go
    ports:
      - "8005:8005"
    environment:
      - FIRESTORE_DATABASE_ID=messages-test
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - ROUTER_SERVICE_URL=http://router:8010
      - ROUTER_TAG=default
    volumes:
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      profiles:
        condition: service_healthy
      router:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/messages/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  users:
    build:
      context: ./services/auth/users_go
    ports:
      - "8006:8006"
    environment:
      - FIRESTORE_DATABASE_ID=users-test
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - ROUTER_SERVICE_URL=http://router:8010
      - ROUTER_TAG=default
    volumes:
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      router:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/users/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  router:
    build:
      context: ./services/router/router_go
    ports:
      - "8010:8010"
    environment:
      - FIRESTORE_DATABASE_ID=router-dev
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
    volumes:
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/router/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  bots:
    build:
      context: ./services/bots/bots_go
    ports:
      - "8011:8011"
    environment:
      - FIRESTORE_DATABASE_ID=bots-test
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - ROUTER_SERVICE_URL=http://router:8010
      - ROUTER_TAG=default
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-emulator:9099
    volumes:
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      router:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/bots/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    ports:
      - "8085:8085"
    command: ["gcloud", "beta", "emulators", "pubsub", "start", "--host-port=0.0.0.0:8085"]
    networks:
      - tavern-net
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:8085"]
      interval: 5s
      timeout: 5s
      retries: 5

  discovery-subscriber:
    build:
      context: ./services/discovery/discovery_subscriber
    environment:
      - FIRESTORE_DATABASE_ID=discovery-test
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PORT=8007
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    networks:
      - tavern-net
    ports:
      - "8007:8007"
    deploy:
      resources:
        limits:
          memory: 128M

  messages-subscriber:
    build:
      context: ./services/messages/messages_subscriber
    environment:
      - FIRESTORE_DATABASE_ID=messages-test
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PORT=8008
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "8008:8008"

  firebase-emulator:
    build:
      context: ./services/firebase-emulator
    ports:
      - "9099:9099"
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9099"]
      interval: 5s
      timeout: 5s
      retries: 10

  init-pubsub:
    image: curlimages/curl:latest
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    command: >
      sh -c "curl -s -X PUT 'http://pubsub-emulator:8085/v1/projects/tavern-swiper-dev/topics/dev-profiles-profile-events-v1' && \
             curl -s -X PUT 'http://pubsub-emulator:8085/v1/projects/tavern-swiper-dev/subscriptions/dev-discovery-subscriber-sub' -H 'Content-Type: application/json' -d '{\"topic\":\"projects/tavern-swiper-dev/topics/dev-profiles-profile-events-v1\",\"pushConfig\":{\"pushEndpoint\":\"http://discovery-subscriber:8007/\"}}' && \
             curl -s -X PUT 'http://pubsub-emulator:8085/v1/projects/tavern-swiper-dev/topics/dev-discovery-match-events-v1' && \
             curl -s -X PUT 'http://pubsub-emulator:8085/v1/projects/tavern-swiper-dev/subscriptions/dev-messages-subscriber-sub' -H 'Content-Type: application/json' -d '{\"topic\":\"projects/tavern-swiper-dev/topics/dev-discovery-match-events-v1\",\"pushConfig\":{\"pushEndpoint\":\"http://messages-subscriber:8008/\"}}' && \
             echo '✅ Pub/Sub Initialized'"
    networks:
      - tavern-net

  characters:
    build:
      context: ./services/characters/characters_go
    ports:
      - "8012:8012"
    environment:
      - FIRESTORE_DATABASE_ID=characters-test
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=tavern-swiper-dev
    volumes:
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - tavern-net
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/characters/health"]
      interval: 10s
      timeout: 5s
      retries: 3


networks:
  tavern-net:
    driver: bridge
