steps:
  # 1. Run Unit Tests
  - name: 'node:20-slim'
    entrypoint: 'npm'
    args: ['install']
    dir: 'frontend'
  - name: 'node:20-slim'
    entrypoint: 'npm'
    args: ['run', 'test:jest']
    dir: 'frontend'

  # 2. Fetch Backend URLs
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🔍 Fetching backend URLs for environment: $_ENV_SUFFIX..."
        get_url() {
          gcloud run services describe "$1$_ENV_SUFFIX" --platform managed --region us-central1 --format 'value(status.url)'
        }
        echo "EXPO_PUBLIC_AUTH_URL=$(get_url auth)" > /workspace/build.env
        echo "EXPO_PUBLIC_USERS_URL=$(get_url users)" >> /workspace/build.env
        echo "EXPO_PUBLIC_PROFILES_URL=$(get_url profiles)" >> /workspace/build.env
        echo "EXPO_PUBLIC_DISCOVERY_URL=$(get_url discovery)" >> /workspace/build.env
        echo "EXPO_PUBLIC_SWIPES_URL=$(get_url discovery)" >> /workspace/build.env
        echo "EXPO_PUBLIC_MESSAGING_URL=$(get_url messages)" >> /workspace/build.env

  # 3. Build Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/build.env
        docker build -t "gcr.io/$PROJECT_ID/app$_ENV_SUFFIX" \
          --platform linux/amd64 \
          --build-arg EXPO_PUBLIC_AUTH_URL=$$EXPO_PUBLIC_AUTH_URL \
          --build-arg EXPO_PUBLIC_USERS_URL=$$EXPO_PUBLIC_USERS_URL \
          --build-arg EXPO_PUBLIC_PROFILES_URL=$$EXPO_PUBLIC_PROFILES_URL \
          --build-arg EXPO_PUBLIC_DISCOVERY_URL=$$EXPO_PUBLIC_DISCOVERY_URL \
          --build-arg EXPO_PUBLIC_SWIPES_URL=$$EXPO_PUBLIC_SWIPES_URL \
          --build-arg EXPO_PUBLIC_MESSAGING_URL=$$EXPO_PUBLIC_MESSAGING_URL \
          --build-arg EXPO_PUBLIC_FIREBASE_API_KEY=AIzaSyCnKm4gayoO0C35CNeMJ7E82fFITvVpGAw \
          --build-arg EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=$PROJECT_ID.firebaseapp.com \
          --build-arg EXPO_PUBLIC_FIREBASE_PROJECT_ID=$PROJECT_ID \
          --build-arg EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=$PROJECT_ID.firebasestorage.app \
          --build-arg EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=374390417125 \
          --build-arg EXPO_PUBLIC_FIREBASE_APP_ID=1:374390417125:web:ec1e664137daa9df11960c \
          ./frontend

  # 2. Push Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/app$_ENV_SUFFIX']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'app$_ENV_SUFFIX'
      - '--image'
      - 'gcr.io/$PROJECT_ID/app$_ENV_SUFFIX'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--service-account'
      - 'tavern-swiper-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--cpu-boost'
      - '--execution-environment'
      - 'gen1'
      - '--allow-unauthenticated'
      - '--quiet'

options:
  logging: GCS_ONLY
  machineType: 'E2_HIGHCPU_8'
logsBucket: "gs://tavern-swiper-build-logs-dev"
