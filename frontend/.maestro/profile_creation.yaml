# Profile Creation Form Tests
#
# Verifies:
# - Navigate to create profile screen
# - Photo upload section is present
# - Name and tagline inputs are visible and interactive
# - Forge/Save button is present

appId: com.tavernswiper.app

---

# Launch the app and log in
- launchApp:
    clearState: true
- runFlow: helpers/auth_login_helper.yaml

# Navigate to Profiles tab
- tapOn:
    id: "tab-bar-profiles"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "profiles-screen"
    timeout: 10000

# Navigate to the create profile screen via whichever button is showing
# Case 1: No profiles — use the empty state CTA
- runFlow:
    when:
      visible:
        id: "empty-state-add-profile-button"
    commands:
      - tapOn:
          id: "empty-state-add-profile-button"

# Case 2: Has profiles — use the add-profile (+) button
- runFlow:
    when:
      visible:
        id: "add-profile-button"
    commands:
      - tapOn:
          id: "add-profile-button"

# Wait for the profile form to load — wait for the name input testID
- extendedWaitUntil:
    visible:
      id: "profile-name-input"
    timeout: 10000

# --- Test: Photo section is present ---
- assertVisible: "Visions of the Self"

# --- Test: Save button in header is present ---
- assertVisible:
    id: "profile-header-save-button"

# --- Test: Identity section is visible ---
- scrollUntilVisible:
    element: "Identity"
    direction: DOWN
- assertVisible: "Identity"

# --- Test: Name input is present and interactive ---
- assertVisible: "True Name"
- tapOn:
    id: "profile-name-input"
- inputText: "Maestro TestHero"

# --- Test: Tagline input is present ---
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "profile-tagline-input"
    direction: DOWN
- assertVisible: "Title / Tagline"
- tapOn:
    id: "profile-tagline-input"
- inputText: "Champion of Automated Testing"
- hideKeyboard

# --- Test: Forge button is present at the bottom ---
- scrollUntilVisible:
    element:
      id: "profile-forge-button"
    direction: DOWN
- assertVisible:
    id: "profile-forge-button"

# Note: We intentionally do NOT press Forge to avoid creating
# test data in the backend. The form rendering is tested above.
