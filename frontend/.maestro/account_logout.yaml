# Account Screen — Logout Tests
#
# Verifies:
# - Account screen renders with testID
# - Logout button is present
# - Logout button works (returns to auth screen)

appId: com.tavernswiper.app

---

# Launch the app and log in
- launchApp:
    clearState: true
- runFlow: helpers/auth_login_helper.yaml

# Navigate to Account tab using testID
- tapOn:
    id: "tab-bar-account"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "account-screen"
    timeout: 10000

# --- Test: Account screen renders ---
- assertVisible:
    id: "account-screen"

# --- Test: Logout button is present ---
- assertVisible:
    id: "logout-button"

# --- Test: Inventory button is present ---
- assertVisible:
    id: "inventory-button"

# --- Test: Logout button works (returns to auth screen) ---
- tapOn:
    id: "logout-button"

# After logout, we should be back on the auth screen
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 15000

# Verify the auth form is rendered
- assertVisible:
    id: "auth-submit-button"
