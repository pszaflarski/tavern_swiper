# Auth Login Screen Tests
# Analogous to: __tests__/Login.test.tsx
#
# Verifies:
# - Auth screen renders with Sign In title
# - Email and password inputs are present and interactive
# - Google sign-in button is visible
# - Submit button is present
# - Toggle between login/signup works

appId: com.tavernswiper.app

---

# Launch the app fresh (clear state to ensure we land on auth)
- launchApp:
    clearState: true

# Wait for fonts to load + Firebase auth to initialize (can take 15-20s on emulator)
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 30000

# --- Test: Auth screen renders with correct title and subtitle ---
- assertVisible: "Sign In"
- assertVisible: "Enter the tavern to continue your journey."

# --- Test: Google sign-in button is visible ---
- assertVisible: "Continue with Google"

# --- Test: Submit button is present ---
- assertVisible: "Enter Tavern"

# --- Test: Toggle link is present ---
- assertVisible: "New to the realm? Sign up instead"

# --- Test: Toggle between login and signup ---
- tapOn: "New to the realm? Sign up instead"
- assertVisible: "Begin Your Quest"
- assertVisible: "Claim Your Title"
- assertVisible: "Already have a title? Log in here"

# Toggle back to login
- tapOn: "Already have a title? Log in here"
- assertVisible: "Sign In"
- assertVisible: "Enter Tavern"

# --- Test: Email and password input are interactive ---
- tapOn: "hero@realm.com"
- inputText: "test@example.com"

- tapOn: "••••••••"
- inputText: "TestPassword123"

# --- Test: Submit with bad credentials shows an error ---
- hideKeyboard
- tapOn: "Enter Tavern"

# Wait for error to appear (invalid credentials against real Firebase)
- extendedWaitUntil:
    visible:
      id: "auth-error-text"
    timeout: 15000
