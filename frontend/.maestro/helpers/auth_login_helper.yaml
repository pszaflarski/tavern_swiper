# Helper: Log in with test credentials
# Called by other flows via: - runFlow: helpers/auth_login_helper.yaml
#
# This flow handles the common case where the app opens to the auth screen.
# It uses the root admin test account for simplicity.
# Handles: splash screen wait, font loading, auth state loading,
#           and the Android "Save password to Google?" system dialog.

appId: com.tavernswiper.app

---

# Wait for the app to fully initialize (fonts + auth check can take 20s+ on emulator)
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 30000

# Dismiss any lingering "Save password" system dialogs from previous runs
- runFlow:
    when:
      visible: "Save password"
    commands:
      - tapOn: "Not now"

- runFlow:
    when:
      visible: "Save your password"
    commands:
      - tapOn: "No thanks"

# Type email — tap the email input by testID for reliability
- tapOn:
    id: "auth-email-input"
- inputText: "peter@gmail.com"

# Type password — tap the password input by testID
- tapOn:
    id: "auth-password-input"
- inputText: "Password123!"

# Hide keyboard before pressing submit
- hideKeyboard

# Press submit button by testID
- tapOn:
    id: "auth-submit-button"

# Dismiss the "Save password to Google?" dialog if it appears
- runFlow: dismiss_save_password.yaml

# 1. Wait for the root-level dice loading screen to fully unmount/disappear if visible
- extendedWaitUntil:
    notVisible:
      id: "dice-loading-screen"
    timeout: 30000

# 2. Wait for login to complete and the tab bar to appear
# Using testID instead of text to avoid textTransform/overlay issues
- extendedWaitUntil:
    visible:
      id: "tab-bar-tavern"
    timeout: 45000

# 3. Wait 2 seconds for the Tavern tab screen to mount and show its local loader if any
- runScript: sleep.js

# 4. Wait for the Tavern screen's local loading screen to disappear
- extendedWaitUntil:
    notVisible:
      id: "dice-loading-screen"
    timeout: 30000
