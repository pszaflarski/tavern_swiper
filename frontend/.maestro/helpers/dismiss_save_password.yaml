# Helper: Dismiss Android "Save password to Google?" dialog
# Called by other flows via: - runFlow: dismiss_save_password.yaml
#
# After login on Android emulators with Play Services, the system shows
# a "Save password to Google?" bottom sheet that blocks the UI.
# This helper dismisses it if present, or does nothing if absent.

appId: com.tavernswiper.app

---

# Wait 2 seconds for the OS system dialog to load and display
- runScript: sleep.js

# Dismiss the "Save password?" dialog if it appears
- runFlow:
    when:
      visible: "Save password"
    commands:
      - tapOn: "Not now"
      - waitForAnimationToEnd

# Alternative wording on some Android versions
- runFlow:
    when:
      visible: "Save your password"
    commands:
      - tapOn: "No thanks"
      - waitForAnimationToEnd


