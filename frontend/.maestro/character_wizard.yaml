# Character Creation Wizard E2E Tests
#
# Verifies:
# - Launch app and log in
# - Navigate to Profiles tab
# - Open Character Creation Wizard
# - Step 1: Select fandom (required)
# - Step 2: Choose gender (optional)
# - Step 3: Select race (optional)
# - Step 4: Choose class (optional)
# - Step 5: Shows matched character details and action buttons
# - Reset wizard navigates back to Step 1

appId: com.tavernswiper.app

---

# Launch the app and log in
- launchApp:
    clearState: true
- runFlow: helpers/auth_login_helper.yaml

# Navigate to Profiles tab
- tapOn:
    id: "tab-bar-profiles"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "profiles-screen"
    timeout: 10000

# Open the Character Wizard screen via whichever launcher is visible
# Case 1: Empty state (first profile)
- runFlow:
    when:
      visible:
        id: "empty-state-wizard-button"
    commands:
      - tapOn:
          id: "empty-state-wizard-button"

# Case 2: Multi-profile list state
- runFlow:
    when:
      visible:
        id: "character-wizard-button"
    commands:
      - tapOn:
          id: "character-wizard-button"

# Wait for the Wizard step 1 to load
- extendedWaitUntil:
    visible: "Select Fandom Universe"
    timeout: 10000

# --- Test Step 1: Fandom (Required) ---
- assertVisible: "Select Fandom Universe"
- assertVisible: "Dungeons & Dragons"
- tapOn: "Dungeons & Dragons"
- tapOn:
    id: "wizard-next-button"

# --- Test Step 2: Gender Identity (Optional) ---
- extendedWaitUntil:
    visible: "Choose Gender Identity"
    timeout: 5000
- assertVisible: "Male"
- assertVisible: "Female"
- tapOn: "Male"
- tapOn:
    id: "wizard-next-button"

# --- Test Step 3: Race / Ancestry (Optional) ---
- extendedWaitUntil:
    visible: "Select Fantasy Race"
    timeout: 5000
- assertVisible: "Elf"
- assertVisible: "Human"
- tapOn: "Elf"
- tapOn:
    id: "wizard-next-button"

# --- Test Step 4: Class (Optional) ---
- extendedWaitUntil:
    visible: "Choose Adventuring Class"
    timeout: 5000
- assertVisible: "Fighter"
- assertVisible: "Wizard"
- tapOn: "Fighter"
- tapOn:
    id: "wizard-next-button"

# --- Test Step 5: Matches & Docked Footer ---
# Wait for the matching characters to load from the backend
- extendedWaitUntil:
    visible: "Adopt This Hero"
    timeout: 10000

# Verify footer controls are visible
- assertVisible: "Adopt This Hero"
- assertVisible: "Back to Start"

# --- Test Navigation Reset ---
# Clicking "Back to Start" should clear all state and return to Step 1
- tapOn: "Back to Start"
- extendedWaitUntil:
    visible: "Select Fandom Universe"
    timeout: 5000
