# Profiles List Screen Tests
#
# Verifies:
# - Profiles screen renders
# - Profile list or empty state is shown
# - "Forge New Identity" button or add-profile button is present

appId: com.tavernswiper.app

---

# Launch the app and log in
- launchApp:
    clearState: true
- runFlow: helpers/auth_login_helper.yaml

# Navigate to Profiles tab
- tapOn:
    id: "tab-bar-profiles"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "profiles-screen"
    timeout: 10000

# --- Test: Screen renders ---
- assertVisible:
    id: "profiles-screen"

# --- Test: Either profiles exist or empty state is shown ---
# Case 1: No profiles — empty state CTA is shown
- runFlow:
    when:
      visible:
        id: "empty-state-add-profile-button"
    commands:
      - assertVisible: "Forge Your First Identity"
      - assertVisible: "You must forge an identity before your legend can begin."

# Case 2: Profiles exist — add-profile button (+) is shown at the bottom
- runFlow:
    when:
      visible:
        id: "add-profile-button"
    commands:
      - assertVisible:
          id: "add-profile-button"
