# Tab Navigation Tests
#
# Verifies:
# - All 4 tab buttons are present (Tavern, Profiles, Messages, Account)
# - Each tab is tappable and navigates to the correct screen
# - Screens load their testID containers

appId: com.tavernswiper.app

---

# Launch the app and log in
- launchApp:
    clearState: true
- runFlow: helpers/auth_login_helper.yaml

# --- Test: All tab bar buttons are present (using testIDs) ---
- assertVisible:
    id: "tab-bar-tavern"
- assertVisible:
    id: "tab-bar-profiles"
- assertVisible:
    id: "tab-bar-messages"
- assertVisible:
    id: "tab-bar-account"

# --- Test: Navigate to Profiles tab ---
- tapOn:
    id: "tab-bar-profiles"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "profiles-screen"
    timeout: 10000

# --- Test: Navigate to Messages tab ---
- tapOn:
    id: "tab-bar-messages"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "messages-screen"
    timeout: 10000

# --- Test: Navigate to Account tab ---
- tapOn:
    id: "tab-bar-account"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "account-screen"
    timeout: 10000

# --- Test: Navigate back to Tavern tab ---
- tapOn:
    id: "tab-bar-tavern"
- waitForAnimationToEnd
