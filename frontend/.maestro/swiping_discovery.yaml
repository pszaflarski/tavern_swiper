# Swiping / Discovery Screen Tests
#
# Verifies:
# - Tavern screen renders (one of two states)
# - Swipe left and right buttons are present (when profiles + cards exist)
# - Or no-profile / empty deck state is shown

appId: com.tavernswiper.app

---

# Launch the app and log in
- launchApp:
    clearState: true
- runFlow: helpers/auth_login_helper.yaml

# Ensure we're on the Tavern tab (should already be here after login)
- tapOn:
    id: "tab-bar-tavern"
- waitForAnimationToEnd

# --- Test: Tavern screen renders (one of multiple states) ---

# State 1: Active profile with swipeable cards
- runFlow:
    when:
      visible:
        id: "tavern-screen"
    commands:
      - assertVisible:
          id: "swipe-left-button"
      - assertVisible:
          id: "swipe-right-button"

# State 2: No profile — needs to create one first
- runFlow:
    when:
      visible:
        id: "tavern-screen-no-profile"
    commands:
      - assertVisible:
          id: "forge-identity-button"

# State 3: Has profile but deck is empty (no cards to swipe)
- runFlow:
    when:
      visible: "No Heroes Found"
    commands:
      - assertVisible: "The realm is quiet tonight..."

# State 4: Loading / scrying
- runFlow:
    when:
      visible: "Scrying The Realm..."
    commands:
      - assertVisible: "Searching distant lands..."
