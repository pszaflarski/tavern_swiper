<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavern Swiper - Loading</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        /* Ambient background glow */
        .ambient-glow {
            position: absolute;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            animation: pulse-glow 4s ease-in-out infinite alternate;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .loading-container {
            position: relative;
            width: 280px;
            height: 400px;
            z-index: 1;
            perspective: 1000px;
        }

        /* The deck of cards */
        .card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            /* Initial state */
            opacity: 0;
            transform: translateY(20px) scale(0.9);
        }

        /* The profile image */
        .hero-silhouette {
            width: 100%;
            height: 100%;
            border-radius: inherit;
            object-fit: cover;
            /* Optional slight fade to blend with the dark background */
            opacity: 0.9;
        }

        /* Loading text */
        .loading-text {
            position: relative;
            z-index: 1;
            margin-top: 60px;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(to right, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: text-shimmer 2s infinite linear;
            background-size: 200% auto;
        }

        @keyframes text-shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        /* 
         * SWIPING ANIMATIONS
         * We create a sequence of 3 cards swiping in a loop.
         */

        /* Card 1: Swipes Right */
        .card:nth-child(1) {
            animation: swipeRight 3.6s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Card 2: Swipes Left (Delayed) */
        .card:nth-child(2) {
            animation: swipeLeft 3.6s infinite cubic-bezier(0.4, 0, 0.2, 1);
            animation-delay: 1.2s;
        }

        /* Card 3: Swipes Right (Delayed further) */
        .card:nth-child(3) {
            animation: swipeRight 3.6s infinite cubic-bezier(0.4, 0, 0.2, 1);
            animation-delay: 2.4s;
        }

        @keyframes swipeRight {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.9) rotateZ(0deg);
            }
            15% {
                opacity: 1;
                transform: translateY(0) scale(1) rotateZ(0deg);
            }
            45% {
                opacity: 1;
                transform: translateY(0) scale(1) rotateZ(0deg);
            }
            60% {
                opacity: 0;
                transform: translateX(150px) translateY(-20px) rotateZ(15deg) scale(0.9);
            }
            100% {
                opacity: 0;
                transform: translateX(150px) translateY(-20px) rotateZ(15deg) scale(0.9);
            }
        }

        @keyframes swipeLeft {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.9) rotateZ(0deg);
            }
            15% {
                opacity: 1;
                transform: translateY(0) scale(1) rotateZ(0deg);
            }
            45% {
                opacity: 1;
                transform: translateY(0) scale(1) rotateZ(0deg);
            }
            60% {
                opacity: 0;
                transform: translateX(-150px) translateY(-20px) rotateZ(-15deg) scale(0.9);
            }
            100% {
                opacity: 0;
                transform: translateX(-150px) translateY(-20px) rotateZ(-15deg) scale(0.9);
            }
        }



    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="loading-container">
        <!-- Card 1 -->
        <div class="card">
            <img src="New%20Project.png" alt="Hero" class="hero-silhouette">
        </div>
        <!-- Card 2 -->
        <div class="card">
            <img src="New%20Project.png" alt="Hero" class="hero-silhouette">
        </div>
        <!-- Card 3 -->
        <div class="card">
            <img src="New%20Project.png" alt="Hero" class="hero-silhouette">
        </div>


    </div>

    <div class="loading-text">Scrying the Realm...</div>

</body>
</html>
