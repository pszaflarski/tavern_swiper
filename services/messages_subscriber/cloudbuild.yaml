steps:
  # 1. Run Unit Tests
  - name: 'golang:1.25'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        go mod download
        go test -v ./...
    dir: 'services/messages_subscriber'

  # 2. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME', '.']
    dir: 'services/messages_subscriber'

  # 3. Push the image to GCR
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME']

  # 4. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🚀 Deploying $_SERVICE_NAME$_ENV_SUFFIX to $_ENV_NAME environment as a Cloud Run service..."

        gcloud run deploy $_SERVICE_NAME$_ENV_SUFFIX \
          --image=gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest \
          --region=us-central1 \
          --no-allow-unauthenticated \
          --service-account=tavern-swiper-sa@$PROJECT_ID.iam.gserviceaccount.com \
          --update-env-vars GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FIRESTORE_DATABASE_ID=$_DB_ID \
          --cpu-boost \
          --memory=512Mi \
          --execution-environment=gen1

        echo "🔐 Ensuring Pub/Sub Invoker permissions..."
        gcloud run services add-iam-policy-binding $_SERVICE_NAME$_ENV_SUFFIX \
          --region=us-central1 \
          --member="serviceAccount:tavern-swiper-sa@$PROJECT_ID.iam.gserviceaccount.com" \
          --role="roles/run.invoker"

        echo "🔗 Configuring Pub/Sub Push Subscription..."
        
        SERVICE_URL=$(gcloud run services describe $_SERVICE_NAME$_ENV_SUFFIX --region us-central1 --format 'value(status.url)')
        SUB_NAME="$_ENV_NAME-messages-from-discovery-match-events-v1-sub"
        TOPIC_NAME="$_ENV_NAME-discovery-match-events-v1"
        SA_EMAIL="tavern-swiper-sa@$PROJECT_ID.iam.gserviceaccount.com"

        # Check if subscription exists
        if gcloud pubsub subscriptions describe $SUB_NAME > /dev/null 2>&1; then
          echo "Updating existing subscription $SUB_NAME..."
          gcloud pubsub subscriptions update $SUB_NAME \
            --push-endpoint=$SERVICE_URL
        else
          echo "Creating new subscription $SUB_NAME..."
          gcloud pubsub subscriptions create $SUB_NAME \
            --topic=$TOPIC_NAME \
            --push-endpoint=$SERVICE_URL \
            --push-auth-service-account=$SA_EMAIL
        fi

options:
  logging: GCS_ONLY
logsBucket: "gs://tavern-swiper-build-logs-dev"
