steps:
  # 1. Run Unit Tests
  - name: 'golang:1.25'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        go test -v ./...
    dir: 'services/$_SERVICE_NAME'

  # 2. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/auth', '.']
    dir: 'services/$_SERVICE_NAME'

  # 3. Push the image to GCR
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/auth']

  # 4. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🚀 Deploying auth$_ENV_SUFFIX to $_ENV_NAME environment..."

        gcloud run deploy auth$_ENV_SUFFIX \
          --image=gcr.io/$PROJECT_ID/auth:latest \
          --region=us-central1 \
          --allow-unauthenticated \
          --service-account=tavern-swiper-sa@$PROJECT_ID.iam.gserviceaccount.com \
          --update-env-vars GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FIRESTORE_DATABASE_ID=$_DB_ID,USERS_DATABASE_ID=$_USERS_DB_ID,JWT_SECRET=super-secret-tavern-key-123,FIREBASE_WEB_API_KEY=$_FIREBASE_WEB_API_KEY \
          --cpu-boost \
          --execution-environment=gen2

options:
  logging: CLOUD_LOGGING_ONLY
