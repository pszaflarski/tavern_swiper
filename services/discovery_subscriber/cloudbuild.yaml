steps:
  # 1. Run Unit Tests
  - name: 'golang:1.25'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        go mod download
        go test -v ./...
    dir: 'services/$_DIR_NAME'

  # 2. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest', '.']
    dir: 'services/$_DIR_NAME'

  # 3. Push the image to GCR
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest']

  # 4. Deploy to Cloud Run
  # 4. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -ex
        echo "🚀 Deploying $_SERVICE_NAME$_ENV_SUFFIX to $_ENV_NAME environment..."

        gcloud run deploy $_SERVICE_NAME$_ENV_SUFFIX \
          --image=gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest \
          --region=us-central1 \
          --no-allow-unauthenticated \
          --service-account=tavern-swiper-sa@$PROJECT_ID.iam.gserviceaccount.com \
          --update-env-vars GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FIRESTORE_DATABASE_ID=$_DB_ID \
          --cpu-boost \
          --memory=512Mi \
          --execution-environment=gen1 \
          --quiet

  # 5. Ensure Pub/Sub Invoker permissions
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -ex
        echo "🔐 Ensuring Pub/Sub Invoker permissions..."
        gcloud run services add-iam-policy-binding $_SERVICE_NAME$_ENV_SUFFIX \
          --region=us-central1 \
          --member="serviceAccount:tavern-swiper-sa@$PROJECT_ID.iam.gserviceaccount.com" \
          --role="roles/run.invoker" \
          --quiet

  # 6. Configure Push Subscription (Idempotent)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -ex
        echo "🔗 Configuring Pub/Sub Push Subscription..."

        SA_EMAIL="tavern-swiper-sa@$PROJECT_ID.iam.gserviceaccount.com"
        SUB_NAME="$_ENV_NAME-discovery-from-profiles-profile-events-v1-sub"
        TOPIC_NAME="$_ENV_NAME-profiles-profile-events-v1"

        # Get service URL
        SERVICE_URL=$(gcloud run services describe $_SERVICE_NAME$_ENV_SUFFIX --region us-central1 --format 'value(status.url)')
        echo "✅ Service URL: $$SERVICE_URL"

        # Idempotent Create or Update
        gcloud pubsub subscriptions create $$SUB_NAME \
          --topic=$$TOPIC_NAME \
          --push-endpoint=$$SERVICE_URL \
          --push-auth-service-account=$$SA_EMAIL \
          --quiet || \
        gcloud pubsub subscriptions update $$SUB_NAME \
          --push-endpoint=$$SERVICE_URL \
          --quiet

options:
  logging: CLOUD_LOGGING_ONLY


