syntax = "proto3";

package discovery;
option go_package = "./proto";

message MatchCreated {
    string match_id = 1;
    repeated string profile_ids = 2;
    string created_at = 3;
}

message MatchDeleted {
    string match_id = 1;
}

message MatchEvent {
    enum EventType {
        UNKNOWN = 0;
        CREATED = 1;
        DELETED = 2;
    }
    EventType type = 1;
    oneof event {
        MatchCreated created = 2;
        MatchDeleted deleted = 3;
    }
}
