steps:
  # 1. Run Unit Tests (Python only)
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt pytest pytest-asyncio httpx respx
          export FIREBASE_WEB_API_KEY="dummy-key-for-test"
          export FIRESTORE_DATABASE_ID="dummy-db"
          export USERS_DATABASE_ID="dummy-users-db"
          export GCS_BUCKET_NAME="dummy-bucket"
          PYTHONPATH=. pytest
        else
          echo "⏩ Skipping Python tests: No requirements.txt found."
        fi
    dir: 'services/$_SERVICE_NAME'

  # 2. Build the container image (Docker only)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$_DEPLOY_TYPE" != "function" ]; then
          docker build -t gcr.io/$PROJECT_ID/$_SERVICE_NAME .
          docker push gcr.io/$PROJECT_ID/$_SERVICE_NAME
        else
          echo "⏩ Skipping Docker build: Deploying as Cloud Function."
        fi
    dir: 'services/$_SERVICE_NAME'


  #  # Deploy to Cloud Run OR Cloud Functions
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        ENV_NAME="dev"
        if [ "$_ENV_SUFFIX" == "-test" ]; then ENV_NAME="test"; fi
        
        if [ "$_DEPLOY_TYPE" == "function" ]; then
          echo "🚀 Deploying as Cloud Function (Env: $ENV_NAME)..."
          gcloud functions deploy $_SERVICE_NAME \
            --gen2 \
            --runtime=go122 \
            --region=us-central1 \
            --source=services/discovery_subscriber \
            --entry-point=HandleProfileEvent \
            --trigger-topic=$ENV_NAME-profiles-profile-events-v1 \
            --service-account=tavern-swiper-sa@$PROJECT_ID.iam.gserviceaccount.com \
            --update-env-vars GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FIRESTORE_DATABASE_ID=$_DB_ID
        else
          echo "☁️ Deploying as Cloud Run Service (Env: $ENV_NAME)..."
          gcloud run deploy $_SERVICE_NAME$_ENV_SUFFIX \
            --image=gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest \
            --region=us-central1 \
            --allow-unauthenticated \
            --service-account=tavern-swiper-sa@$PROJECT_ID.iam.gserviceaccount.com \
            --update-env-vars GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FIRESTORE_DATABASE_ID=$_DB_ID,JWT_SECRET=super-secret-tavern-key-123,GCS_BUCKET_NAME=$PROJECT_ID-media,PUBSUB_TOPIC_ID=$ENV_NAME-profiles-profile-events-v1,PUBSUB_PROJECT_ID=$PROJECT_ID \
            --cpu-boost \
            --execution-environment=gen1
        fi


options:
  logging: CLOUD_LOGGING_ONLY

# NOTE: Inter-service URLs are handled by the microservices using internal discovery logic 
# or by fetching them via the SDK if needed, but since we use stable names 
# (e.g. auth-test.a.run.app), we keep them mostly static or updated via a global script.
# For simplicity in this auto-deploy, we rely on the stable service names.
