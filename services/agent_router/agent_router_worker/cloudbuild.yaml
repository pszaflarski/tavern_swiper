steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$SHORT_SHA', '-t', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest', '.']
    dir: 'services/agent_router/agent_router_worker'
    env:
      - 'DOCKER_BUILDKIT=1'

  # 2. Push the image to GCR
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🚀 Deploying $_SERVICE_NAME$_ENV_SUFFIX to $_ENV_NAME environment as a Cloud Run service..."

        gcloud run deploy $_SERVICE_NAME$_ENV_SUFFIX \
          --image=gcr.io/$PROJECT_ID/$_SERVICE_NAME:$SHORT_SHA \
          --region=us-central1 \
          --no-allow-unauthenticated \
          --service-account=tavern-swiper-sa@$PROJECT_ID.iam.gserviceaccount.com \
          --update-env-vars GOOGLE_CLOUD_PROJECT=$PROJECT_ID,ENV=$_ENV_NAME,FIRESTORE_DATABASE_ID=agent-router-$_ENV_NAME,GOOGLE_AI_STUDIO_API_KEY=$_GOOGLE_AI_STUDIO_API_KEY,OPENAI_API_KEY=$_OPENAI_API_KEY \
          --cpu-boost \
          --memory=1Gi \
          --execution-environment=gen1 \
          --quiet

options:
  logging: CLOUD_LOGGING_ONLY
