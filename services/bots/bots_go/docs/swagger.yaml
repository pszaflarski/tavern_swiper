basePath: /bots
definitions:
  main.BotCreate:
    properties:
      bio:
        type: string
      display_name:
        type: string
      slug:
        type: string
      tagline:
        type: string
    required:
    - slug
    type: object
  main.BotOut:
    properties:
      bot_id:
        type: string
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      firebase_uid:
        type: string
      slug:
        type: string
      state:
        type: string
      user_id:
        type: string
    type: object
  main.BotProfileCreate:
    properties:
      age:
        type: integer
      agent_name:
        description: e.g. "barkeep-bob-agent"
        type: string
      behavior_type:
        description: e.g. "tavern_keeper", "quest_giver"
        type: string
      bio:
        type: string
      display_name:
        type: string
      events:
        items:
          $ref: '#/definitions/main.ProfileTag'
        type: array
      fandom:
        items:
          $ref: '#/definitions/main.ProfileTag'
        type: array
      gender:
        items:
          $ref: '#/definitions/main.ProfileTag'
        type: array
      image_links:
        items:
          type: string
        type: array
      interests:
        items:
          $ref: '#/definitions/main.ProfileTag'
        type: array
      is_oc:
        type: boolean
      looking_for:
        items:
          $ref: '#/definitions/main.ProfileTag'
        type: array
      other_tags:
        additionalProperties:
          items:
            $ref: '#/definitions/main.ProfileTag'
          type: array
        type: object
      race:
        items:
          $ref: '#/definitions/main.ProfileTag'
        type: array
      tagline:
        type: string
    required:
    - display_name
    type: object
  main.BotProfileOut:
    properties:
      agent_name:
        type: string
      behavior_type:
        type: string
      bot_profile_id:
        type: string
      bot_user_id:
        type: string
      created_at:
        type: string
      profile_id:
        type: string
    type: object
  main.CredsResponse:
    properties:
      email:
        type: string
      note:
        type: string
      password:
        type: string
    type: object
  main.ErrorResponse:
    properties:
      detail: {}
    type: object
  main.HealthResponse:
    properties:
      service:
        type: string
      status:
        type: string
    type: object
  main.ProfileTag:
    properties:
      category:
        type: string
      id:
        type: string
      name:
        type: string
      slug:
        type: string
      status:
        type: string
    type: object
info:
  contact: {}
  description: Manage system bots and their credentials
  title: Bots Service API
  version: "1.0"
paths:
  /:
    get:
      description: Returns all registered bot user records.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.BotOut'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all bot users
      tags:
      - bots
    post:
      consumes:
      - application/json
      description: Creates a new bot identity via Firebase Auth, initializes a user
        record, and stores encrypted credentials.
      parameters:
      - description: Bot creation payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.BotCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.BotOut'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Register a new bot user
      tags:
      - bots
  /{id}:
    delete:
      description: Deletes a bot user record and all its bot profile records. The
        Firebase Auth user and profiles service data remain and can be manually purged.
      parameters:
      - description: Bot User ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a bot user
      tags:
      - bots
    get:
      description: Returns the details of a specific bot user and all its profiles.
      parameters:
      - description: Bot User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a bot user by ID
      tags:
      - bots
  /{id}/creds:
    post:
      description: Decrypts and returns the bot's login credentials. Verifies they
        work first. If verification fails (e.g. after an environment wipe), the bot
        is automatically re-registered.
      parameters:
      - description: Bot User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.CredsResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get bot credentials
      tags:
      - bots
  /{id}/profile:
    post:
      consumes:
      - application/json
      description: Creates a profile via the profiles service using the bot's own
        credentials. Accepts public image URLs which are downloaded and re-uploaded.
        The profile is tracked in the bot_profiles collection.
      parameters:
      - description: Bot User ID
        in: path
        name: id
        required: true
        type: string
      - description: Profile creation payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.BotProfileCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a profile for a bot
      tags:
      - bots
  /{id}/profiles:
    get:
      description: Returns all profiles associated with a bot user.
      parameters:
      - description: Bot User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.BotProfileOut'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List profiles for a bot user
      tags:
      - bots
  /{id}/sync:
    post:
      description: Reconciles the bot_profiles collection with the profiles service.
        Creates tracking records for untracked profiles, removes stale records for
        deleted profiles, and deletes orphaned profiles from the profiles service
        that aren't tracked.
      parameters:
      - description: Bot User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Sync bot profiles with profiles service
      tags:
      - bots
  /all:
    delete:
      description: Deletes all bot user records and all bot profile records. Root
        Admin only.
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Purge all bots
      tags:
      - admin
  /health:
    get:
      description: Returns the health status of the bots service.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.HealthResponse'
      summary: Health check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
