basePath: /bots
definitions:
  main.BotCreate:
    properties:
      bio:
        type: string
      display_name:
        type: string
      slug:
        type: string
      tagline:
        type: string
    required:
    - slug
    type: object
  main.BotOut:
    properties:
      bot_id:
        type: string
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      firebase_uid:
        type: string
      profile_id:
        type: string
      slug:
        type: string
      state:
        type: string
    type: object
  main.BotProfileCreate:
    properties:
      age:
        type: integer
      bio:
        type: string
      display_name:
        type: string
      events:
        items:
          $ref: '#/definitions/main.ProfileTag'
        type: array
      fandom:
        items:
          $ref: '#/definitions/main.ProfileTag'
        type: array
      gender:
        items:
          $ref: '#/definitions/main.ProfileTag'
        type: array
      image_links:
        items:
          type: string
        type: array
      interests:
        items:
          $ref: '#/definitions/main.ProfileTag'
        type: array
      is_oc:
        type: boolean
      looking_for:
        items:
          $ref: '#/definitions/main.ProfileTag'
        type: array
      other_tags:
        additionalProperties:
          items:
            $ref: '#/definitions/main.ProfileTag'
          type: array
        type: object
      race:
        items:
          $ref: '#/definitions/main.ProfileTag'
        type: array
      tagline:
        type: string
    required:
    - display_name
    type: object
  main.CredsResponse:
    properties:
      email:
        type: string
      note:
        type: string
      password:
        type: string
    type: object
  main.ErrorResponse:
    properties:
      detail: {}
    type: object
  main.HealthResponse:
    properties:
      service:
        type: string
      status:
        type: string
    type: object
  main.ProfileTag:
    properties:
      category:
        type: string
      id:
        type: string
      name:
        type: string
      slug:
        type: string
      status:
        type: string
    type: object
info:
  contact: {}
  description: Manage system bots and their credentials
  title: Bots Service API
  version: "1.0"
paths:
  /:
    get:
      description: Returns all registered bot records.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.BotOut'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all bots
      tags:
      - bots
    post:
      consumes:
      - application/json
      description: Creates a new bot identity via Firebase Auth, initializes a user
        record, and optionally creates a profile. Credentials are encrypted and stored.
      parameters:
      - description: Bot creation payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.BotCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.BotOut'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Register a new bot
      tags:
      - bots
  /{id}:
    delete:
      description: Deletes a bot record. The Firebase Auth user and profile remain
        and can be manually purged.
      parameters:
      - description: Bot ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a bot
      tags:
      - bots
    get:
      description: Returns the details of a specific bot.
      parameters:
      - description: Bot ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.BotOut'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a bot by ID
      tags:
      - bots
  /{id}/creds:
    post:
      description: Decrypts and returns the bot's login credentials. Verifies they
        work first. If verification fails (e.g. after an environment wipe), the bot
        is automatically re-registered.
      parameters:
      - description: Bot ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.CredsResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get bot credentials
      tags:
      - bots
  /{id}/profile:
    post:
      consumes:
      - application/json
      description: Creates a profile via the profiles service using the bot's own
        credentials. Accepts public image URLs which are downloaded and re-uploaded.
      parameters:
      - description: Bot ID
        in: path
        name: id
        required: true
        type: string
      - description: Profile creation payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.BotProfileCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a profile for a bot
      tags:
      - bots
  /all:
    delete:
      description: Deletes all bot records. Root Admin only.
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Purge all bots
      tags:
      - admin
  /health:
    get:
      description: Returns the health status of the bots service.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.HealthResponse'
      summary: Health check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
