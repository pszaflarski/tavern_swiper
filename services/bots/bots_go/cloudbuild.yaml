steps:
  # 1. Run Unit Tests
  - name: 'golang:1.25'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        go mod download
        go test -v ./... -skip TestSnapshotsParity
    dir: 'services/bots/$_DIR_NAME'
  # 2. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$SHORT_SHA', '-t', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest', '.']
    dir: 'services/bots/$_DIR_NAME'
    env:
      - 'DOCKER_BUILDKIT=1'

  # 3. Push the image to GCR
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME']

  # 4. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🚀 Deploying $_SERVICE_NAME to $_ENV_NAME environment as a Cloud Run service..."

        gcloud run deploy $_SERVICE_NAME$_ENV_SUFFIX \
          --image=gcr.io/$PROJECT_ID/$_SERVICE_NAME:$SHORT_SHA \
          --region=us-central1 \
          --allow-unauthenticated \
          --service-account=tavern-swiper-sa@$PROJECT_ID.iam.gserviceaccount.com \
          --update-env-vars GOOGLE_CLOUD_PROJECT=$PROJECT_ID,ENV=$_ENV_NAME,FIRESTORE_DATABASE_ID=$_DB_ID,JWT_SECRET=$_JWT_SECRET,KMS_KEY_NAME=$_KMS_KEY_NAME,ROUTER_SERVICE_URL=$_ROUTER_SERVICE_URL,ROUTER_TAG=$_ROUTER_TAG,USE_ASYNC_AGENT=true \
          --cpu-boost \
          --execution-environment=gen1

options:
  logging: CLOUD_LOGGING_ONLY
