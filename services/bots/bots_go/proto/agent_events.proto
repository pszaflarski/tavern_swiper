syntax = "proto3";

package agent;

option go_package = "./proto";

message AgentRequestEvent {
  string request_id = 1;
  string conversation_id = 2;
  string agent_name = 3;
  string prompt = 4;
  string message_type = 5;       // "user", "system", "event"
  string metadata_json = 6;      // JSON-encoded metadata
  string bot_profile_id = 7;
  string bot_user_id = 8;
  string sender_profile_id = 9;
  string behavior_type = 10;
  string timestamp = 11;         // RFC3339
  string model = 12;
}

message AgentResponseEvent {
  string request_id = 1;
  string conversation_id = 2;
  string bot_profile_id = 3;
  string bot_user_id = 4;
  string sender_profile_id = 5;
  string behavior_type = 6;
  string agent_name = 7;
  string status = 8;             // "SUCCESS" or "ERROR"
  string response_json = 9;       // JSON array of parsed message/narration items
  string error_message = 10;
  string metadata_json = 11;
  string timestamp = 12;         // RFC3339
}
