basePath: /messages
definitions:
  main.ConversationCreate:
    properties:
      participant_profile_ids:
        items:
          type: string
        minItems: 2
        type: array
    required:
    - participant_profile_ids
    type: object
  main.ConversationOut:
    properties:
      created_at:
        type: string
      id:
        type: string
      last_message:
        $ref: '#/definitions/main.LastMessageInfo'
      other_profile_id:
        type: string
      participant_ids:
        items:
          type: string
        type: array
      unread:
        type: boolean
      updated_at:
        type: string
    type: object
  main.DiceRollRequest:
    properties:
      conversation_id:
        description: Optional — if present, posts an event message
        type: string
      profile_id:
        description: Required when conversation_id is set
        type: string
      type:
        description: d4, d6, d8, d12, d20
        type: string
    required:
    - type
    type: object
  main.DiceRollResponse:
    properties:
      conversation_id:
        type: string
      message_id:
        description: Set when conversation_id was provided
        type: string
      result:
        type: integer
      type:
        type: string
    type: object
  main.LastMessageInfo:
    properties:
      content:
        type: string
      sender_profile_id:
        type: string
      sent_at:
        type: string
      type:
        type: string
    type: object
  main.MessageCreate:
    properties:
      content:
        type: string
      sender_profile_id:
        description: Required for user messages, omitted for system/event
        type: string
      type:
        description: '"user" (default), "system", "event"'
        type: string
    required:
    - content
    type: object
  main.MessageOut:
    properties:
      content:
        type: string
      conversation_id:
        type: string
      message_id:
        type: string
      sender_profile_id:
        type: string
      sent_at:
        type: string
      type:
        type: string
    type: object
info:
  contact: {}
paths:
  /:
    delete:
      description: Deletes all conversations, messages, and profile-conversation mappings.
        Admin only.
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Purge all messaging data
      tags:
      - admin
  /conversations:
    post:
      consumes:
      - application/json
      description: Creates a new 1-on-1 conversation between two matched profiles.
        Returns existing if already created.
      parameters:
      - description: Participant profile IDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.ConversationCreate'
      produces:
      - application/json
      responses:
        "200":
          description: Existing conversation_id
          schema:
            additionalProperties:
              type: string
            type: object
        "201":
          description: conversation_id
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a conversation
      tags:
      - conversations
  /conversations/{id}/messages:
    get:
      description: Returns all messages in a conversation, sorted by creation time.
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.MessageOut'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get messages in a conversation
      tags:
      - messages
    post:
      consumes:
      - application/json
      description: Sends a message in a conversation. For type "user" (default), sender
        must be a participant. For type "system" or "event", admin authorization is
        required and sender_profile_id is optional.
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      - description: Message payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.MessageCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.MessageOut'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Send a message
      tags:
      - messages
  /conversations/profile/{profile_id}:
    get:
      description: Returns all conversations that include the given profile, sorted
        by most recent activity.
      parameters:
      - description: Profile ID
        in: path
        name: profile_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.ConversationOut'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List conversations for a profile
      tags:
      - conversations
  /health:
    get:
      description: Returns the health status of the messages service.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
  /roll-dice:
    post:
      consumes:
      - application/json
      description: Rolls a die of the specified type. If conversation_id is provided,
        posts the result as an event message to that conversation. The caller must
        be a participant in the conversation.
      parameters:
      - description: Dice roll payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.DiceRollRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.DiceRollResponse'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Roll dice
      tags:
      - dice
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
